<anvil-form container="ColumnPanel" prop:role="pos-form">
  <style>
  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
  }

  anvil-form[role="pos-form"],
  anvil-form[role="pos-form"] .pos-viewport {
    margin-top: 0 !important;
    padding-top: 0 !important;
  }

  .pos-viewport {
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    display: block !important;
    position: relative !important;
    top: 0 !important;
    transform: none !important;
  }

  .pos-viewport > anvil-dropzone,
  anvil-dropzone[name="default"] {
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    min-height: 0 !important;
  }

  .pos-viewport .hero,
  .pos-viewport .hero-content,
  .pos-viewport main,
  .pos-viewport section:first-child {
    margin-top: 0 !important;
    padding-top: 0 !important;
  }
</style>
  <div class="pos-viewport" anvil:container:full_width_row="true">
    <anvil-dropzone name="default"></anvil-dropzone>
  </div>
</anvil-form>
